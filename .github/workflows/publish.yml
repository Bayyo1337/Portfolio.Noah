name: Publish Portfolio

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore Portfolio.Marvin/Portfolio.Marvin.csproj

    - name: Build
      run: dotnet build Portfolio.Marvin/Portfolio.Marvin.csproj --no-restore -c Release

    - name: Publish
      run: dotnet publish Portfolio.Marvin/Portfolio.Marvin.csproj -c Release -o ./publish --no-build

    - name: Zip Release
      run: |
        cd publish
        zip -r ../release.zip .
        cd ..

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release.zip
        tag_name: release-${{ github.run_number }}
        name: Release ${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
