name: Release Portfolio

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Portfolio.Noah/Portfolio.Noah.csproj

    - name: Publish (Self-Contained Linux x64)
      run: dotnet publish Portfolio.Noah/Portfolio.Noah.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -o ./publish

    - name: Zip Release
      run: |
        cd publish
        zip -r ../release.zip .
        cd ..

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release.zip
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
